name: release

# Pushing a v* tag checks the build, runs e2e against the minimum and latest supported pi,
# and publishes a GitHub Release with the npm pack tarball and the installer script attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  e2e-pi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.0.0 is the minimum pi the README promises.
        pi: ['1.0.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: node --import tsx --test 'test/e2e/**/*.test.ts'

  release:
    needs: e2e-pi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:pack
      - run: npm pack
      # pidea.tgz and install.sh keep one name across releases, so the README's
      # releases/latest/download/ links always work.
      - run: cp pidea-*.tgz pidea.tgz && cp scripts/install.sh install.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pidea-*.tgz pidea.tgz install.sh --verify-tag --generate-notes
