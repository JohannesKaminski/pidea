name: Bug report
description: Report a defect or failing behavior
title: '[bug]: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact steps or commands that trigger the failure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen and what happens instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [chat / ACP, IDE tools (MCP), IntelliJ-first mode, setup / update, docs, other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: 'pidea, pi, Node.js, IDE and OS, e.g. "pidea 0.2.0, pi 1.0.0, Node 24, IntelliJ IDEA 2026.2, macOS".'
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs
      description: Error messages, or the relevant part of ~/.pi/pidea/acp-debug.log (set PIDEA_DEBUG_ACP=1).
      render: text
    validations:
      required: false
