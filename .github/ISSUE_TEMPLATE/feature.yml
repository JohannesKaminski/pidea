name: Feature
description: New capability or enhancement for pidea
title: '[feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should pidea do?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [chat / ACP, IDE tools (MCP), IntelliJ-first mode, setup / update, docs, other]
    validations:
      required: true
